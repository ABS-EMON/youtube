<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EMON — Video Downloader</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --red: #ff2d2d;
  --blue: #1877f2;
  --green: #22c55e;
  --orange: #f97316;
  --dark: #111827;
  --gray: #6b7280;
  --light: #f9fafb;
  --border: #e5e7eb;
  --white: #ffffff;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 40px rgba(0,0,0,0.12);
  --radius: 14px;
  --radius-sm: 8px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: #f0f2f5;
  color: var(--dark);
  min-height: 100vh;
  padding: 24px 16px 60px;
}

/* ── HEADER ─────────────────────────────── */
.header {
  text-align: center;
  margin-bottom: 28px;
}

.logo-wrap {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 6px;
}

.logo-icon {
  width: 44px; height: 44px;
  background: var(--red);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px rgba(255,45,45,0.35);
}

.logo-icon svg { width: 22px; height: 22px; fill: white; }

.logo-title {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.logo-title span { color: var(--red); }

.header-sub {
  font-size: 13px;
  color: var(--gray);
  letter-spacing: 0.2px;
}

/* ── MAIN CARD ───────────────────────────── */
.main {
  max-width: 700px;
  margin: 0 auto;
}

.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.3s;
}

.card:hover { box-shadow: var(--shadow-md); }

.card + .card { margin-top: 16px; }

.card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 18px;
}

.card-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
}

.card-icon.red { background: #fff0f0; }
.card-icon.blue { background: #eff6ff; }

.card-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--dark);
}

/* ── PLATFORM BADGE ─────────────────────── */
.platform-row {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

.platform-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 11px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  border: 2px solid transparent;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--light);
  color: var(--gray);
}

.platform-badge.yt { border-color: #fecaca; color: #dc2626; }
.platform-badge.fb { border-color: #bfdbfe; color: #2563eb; }
.platform-badge.detected { background: #ecfdf5; color: #16a34a; border-color: #86efac; font-size: 11px; padding: 4px 10px; }

/* ── INPUT ───────────────────────────────── */
.input-row {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
}

input[type="text"] {
  flex: 1;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  outline: none;
  transition: 0.2s;
  color: var(--dark);
  background: var(--white);
}

input[type="text"]:focus {
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(255,45,45,0.08);
}

input[type="text"]::placeholder { color: #c0c4cc; }

/* ── FORMAT SELECTOR ─────────────────────── */
.format-row {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.fmt-btn {
  flex: 1;
  padding: 10px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  background: var(--white);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--gray);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.fmt-btn:hover { border-color: #d1d5db; color: var(--dark); }

.fmt-btn.active.mp4 {
  border-color: var(--red);
  background: #fff5f5;
  color: var(--red);
}

.fmt-btn.active.mp3 {
  border-color: #7c3aed;
  background: #f5f3ff;
  color: #7c3aed;
}

/* ── DOWNLOAD BUTTON ─────────────────────── */
.dl-btn {
  width: 100%;
  padding: 13px;
  background: var(--red);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.2px;
  position: relative;
  overflow: hidden;
}

.dl-btn:hover { background: #e01f1f; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(255,45,45,0.3); }
.dl-btn:active { transform: translateY(0); }
.dl-btn:disabled { background: #fca5a5; cursor: not-allowed; transform: none; box-shadow: none; }

/* ── PROGRESS ────────────────────────────── */
.progress-wrap {
  margin-top: 16px;
  display: none;
}

.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--gray);
  margin-bottom: 6px;
}

.progress-bar-bg {
  width: 100%;
  height: 8px;
  background: #f3f4f6;
  border-radius: 99px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--red), #ff6b35);
  border-radius: 99px;
  width: 0%;
  transition: width 0.4s ease;
}

.progress-bar.done { background: var(--green); }

/* ── FILES TABLE ─────────────────────────── */
.files-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.files-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.files-table th {
  text-align: left;
  padding: 10px 12px;
  font-size: 11px;
  font-weight: 600;
  color: var(--gray);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
  background: var(--light);
}

.files-table th:first-child { border-radius: 8px 0 0 8px; }
.files-table th:last-child { border-radius: 0 8px 8px 0; }

.files-table td {
  padding: 12px 12px;
  border-bottom: 1px solid #f3f4f6;
  vertical-align: middle;
}

.files-table tr:last-child td { border-bottom: none; }

.files-table tr:hover td { background: #fafafa; }

.file-title {
  font-weight: 500;
  color: var(--dark);
  max-width: 220px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

.tag.mp4 { background: #fee2e2; color: #dc2626; }
.tag.mp3 { background: #ede9fe; color: #7c3aed; }
.tag.yt  { background: #fee2e2; color: #dc2626; }
.tag.fb  { background: #dbeafe; color: #2563eb; }

.timer {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--orange);
}

.timer.urgent { color: var(--red); }
.timer.safe   { color: var(--green); }

.action-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
  text-decoration: none;
}

.action-btn.dl {
  background: #eff6ff;
  color: #2563eb;
}
.action-btn.dl:hover { background: #dbeafe; }

.action-btn.del {
  background: #fff5f5;
  color: #ef4444;
}
.action-btn.del:hover { background: #fee2e2; }

.actions-cell { display: flex; gap: 6px; align-items: center; }

/* ── EMPTY STATE ─────────────────────────── */
.empty-state {
  text-align: center;
  padding: 36px 0;
  color: var(--gray);
}

.empty-state .empty-icon { font-size: 36px; margin-bottom: 10px; }
.empty-state p { font-size: 13px; }

/* ── TOAST ───────────────────────────────── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--dark);
  color: white;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 500;
  z-index: 9999;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  white-space: nowrap;
}

.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { background: #16a34a; }
.toast.error   { background: #dc2626; }

/* ── SIZE TEXT ───────────────────────────── */
.size-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--gray);
}

/* ── DETECTED PLATFORM ───────────────────── */
.detect-row {
  margin-bottom: 12px;
  min-height: 22px;
}

/* ── REFRESH BTN ─────────────────────────── */
.refresh-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--white);
  color: var(--gray);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  font-family: 'DM Sans', sans-serif;
}

.refresh-btn:hover { border-color: #d1d5db; color: var(--dark); background: var(--light); }

.between-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
</style>
</head>

<body>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<div class="main">

  <!-- HEADER -->
  <div class="header">
    <div class="logo-wrap">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M8 6.82v10.36c0 .79.87 1.27 1.54.84l8.14-5.18a1 1 0 000-1.69L9.54 5.98A1 1 0 008 6.82z"/></svg>
      </div>
      <div class="logo-title">Emon<span>Tube</span></div>
    </div>
    <div class="header-sub">Download YouTube & Facebook videos instantly</div>
  </div>

  <!-- DOWNLOADER CARD -->
  <div class="card">
    <div class="card-header">
      <div class="card-icon red">⬇️</div>
      <span class="card-title">Download Video or Audio</span>
    </div>

    <!-- Platform detection display -->
    <div class="detect-row" id="detectRow"></div>

    <!-- URL Input -->
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="Paste YouTube or Facebook video URL…" oninput="detectPlatform(this.value)" />
    </div>

    <!-- Format selector -->
    <div class="format-row">
      <button class="fmt-btn active mp4" id="fmtMp4" onclick="selectFormat('mp4')">
        🎬 MP4 Video
      </button>
      <button class="fmt-btn mp3" id="fmtMp3" onclick="selectFormat('mp3')">
        🎵 MP3 Audio
      </button>
    </div>

    <!-- Download button -->
    <button class="dl-btn" id="dlBtn" onclick="startDownload()">
      ⬇ Download Now
    </button>

    <!-- Progress bar -->
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-label">
        <span id="progressStatus">Preparing download…</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
  </div>

  <!-- STORED FILES CARD -->
  <div class="card">
    <div class="between-row">
      <div class="card-header" style="margin-bottom:0">
        <div class="card-icon blue">📁</div>
        <span class="card-title">Downloaded Files</span>
      </div>
      <button class="refresh-btn" onclick="loadFiles()">↻ Refresh</button>
    </div>

    <div class="files-wrap" id="filesWrap">
      <div class="empty-state">
        <div class="empty-icon">📂</div>
        <p>No files yet. Download something above!</p>
      </div>
    </div>
  </div>

</div>

<script>
let selectedFormat = 'mp4';
let pollTimer = null;

// ── FORMAT SELECTOR ──────────────────
function selectFormat(fmt) {
  selectedFormat = fmt;
  document.getElementById('fmtMp4').className = 'fmt-btn' + (fmt === 'mp4' ? ' active mp4' : '');
  document.getElementById('fmtMp3').className = 'fmt-btn' + (fmt === 'mp3' ? ' active mp3' : '');
}

// ── PLATFORM DETECTION ────────────────
function detectPlatform(val) {
  const row = document.getElementById('detectRow');
  val = (val || '').toLowerCase();
  if (val.includes('youtube.com') || val.includes('youtu.be')) {
    row.innerHTML = `<span class="platform-badge yt">▶ YouTube detected</span>`;
  } else if (val.includes('facebook.com') || val.includes('fb.watch') || val.includes('fb.com')) {
    row.innerHTML = `<span class="platform-badge fb">f Facebook detected</span>`;
  } else if (val.length > 5) {
    row.innerHTML = `<span class="platform-badge" style="color:#f59e0b;border-color:#fde68a">⚠ Unknown platform</span>`;
  } else {
    row.innerHTML = '';
  }
}

// ── DOWNLOAD ──────────────────────────
async function startDownload() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) { showToast('Please paste a video URL', 'error'); return; }

  const taskId = Date.now().toString();
  const btn = document.getElementById('dlBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Starting…';

  showProgress(0, 'Connecting…');

  try {
    // Start polling
    pollTimer = setInterval(() => pollProgress(taskId), 800);

    const res = await fetch('/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, format: selectedFormat, task_id: taskId })
    });

    clearInterval(pollTimer);

    const data = await res.json();

    if (data.error) {
      hideProgress();
      showToast(data.error, 'error');
      btn.disabled = false;
      btn.textContent = '⬇ Download Now';
      return;
    }

    setProgress(100, 'Done!', true);
    showToast(`Downloaded: ${data.title}`, 'success');
    btn.disabled = false;
    btn.textContent = '⬇ Download Now';
    document.getElementById('urlInput').value = '';
    document.getElementById('detectRow').innerHTML = '';

    setTimeout(() => { hideProgress(); loadFiles(); }, 1200);

  } catch (e) {
    clearInterval(pollTimer);
    hideProgress();
    showToast('Server error. Is Flask running?', 'error');
    btn.disabled = false;
    btn.textContent = '⬇ Download Now';
  }
}

async function pollProgress(taskId) {
  try {
    const res = await fetch(`/progress?task_id=${taskId}`);
    const d = await res.json();
    if (d.percent !== undefined) {
      const pct = Math.round(d.percent);
      const label = d.status === 'downloading' ? `Downloading… ${pct}%` : d.status === 'finished' ? 'Processing…' : 'Preparing…';
      setProgress(pct, label, false);
    }
  } catch {}
}

function showProgress(pct, label) {
  document.getElementById('progressWrap').style.display = 'block';
  setProgress(pct, label, false);
}

function setProgress(pct, label, done) {
  document.getElementById('progressStatus').textContent = label;
  document.getElementById('progressPct').textContent = pct + '%';
  const bar = document.getElementById('progressBar');
  bar.style.width = pct + '%';
  bar.className = 'progress-bar' + (done ? ' done' : '');
}

function hideProgress() {
  document.getElementById('progressWrap').style.display = 'none';
}

// ── FILE LIST ─────────────────────────
async function loadFiles() {
  try {
    const res = await fetch('/list-videos');
    const data = await res.json();
    renderFiles(data.files || []);
  } catch {
    document.getElementById('filesWrap').innerHTML = `<div class="empty-state"><p>Could not load files.</p></div>`;
  }
}

function renderFiles(files) {
  const wrap = document.getElementById('filesWrap');

  if (!files.length) {
    wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">📂</div><p>No files yet. Download something above!</p></div>`;
    return;
  }

  let html = `<table class="files-table">
    <thead>
      <tr>
        <th>Title</th>
        <th>Type</th>
        <th>Size</th>
        <th>Expires</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>`;

  files.forEach(f => {
    const secs = f.expires_in;
    const timerClass = secs < 30 ? 'urgent' : secs < 60 ? '' : 'safe';
    const timerText = secs > 0 ? `${secs}s` : 'Expired';
    const platformTag = `<span class="tag ${f.platform === 'youtube' ? 'yt' : 'fb'}">${f.platform === 'youtube' ? 'YT' : 'FB'}</span>`;
    const fmtTag = `<span class="tag ${f.format}">${f.format.toUpperCase()}</span>`;

    html += `<tr>
      <td><div class="file-title" title="${esc(f.title)}">${esc(f.title)}</div></td>
      <td>${platformTag} ${fmtTag}</td>
      <td><span class="size-text">${f.size_mb} MB</span></td>
      <td><span class="timer ${timerClass}">⏱ ${timerText}</span></td>
      <td>
        <div class="actions-cell">
          <a class="action-btn dl" href="${f.download_url}" download>⬇ Save</a>
          <button class="action-btn del" onclick="deleteFile('${esc(f.file)}')">🗑 Delete</button>
        </div>
      </td>
    </tr>`;
  });

  html += `</tbody></table>`;
  wrap.innerHTML = html;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function deleteFile(filename) {
  try {
    const res = await fetch('/delete-video', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: filename })
    });
    const d = await res.json();
    if (d.success) {
      showToast('File deleted', 'success');
      loadFiles();
    } else {
      showToast(d.error || 'Delete failed', 'error');
    }
  } catch {
    showToast('Could not delete file', 'error');
  }
}

// ── TOAST ──────────────────────────────
let toastTimer = null;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 3200);
}

// ── AUTO REFRESH FILE LIST ─────────────
setInterval(loadFiles, 10000); // refresh every 10s

// ── INIT ──────────────────────────────
loadFiles();
</script>

</body>
</html>
